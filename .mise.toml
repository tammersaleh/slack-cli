[tools]
go = "1.25"
# golangci-lint must be built with a Go at least as new as the code. Rebuild it
# after a Go bump:
# `mise install --force go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint`.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
# govulncheck is pinned to 1.1.4 because newer releases need Go 1.26.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"

[tasks.build]
description = "Build the slack binary"
run = "go build -o slack ./cmd/slack"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.setup-hooks]
description = "Configure git to use .githooks/"
run = "git config core.hooksPath .githooks"

[tasks.check]
description = "Run test and lint (matches pre-push hook)"
depends = ["test", "lint"]
